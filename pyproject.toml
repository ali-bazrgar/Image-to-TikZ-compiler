[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "image-to-tikz-compiler"
version = "0.2.0"
description = "Model-agnostic image understanding pipeline that converts raster diagrams into an LLM-readable visual intermediate representation (VIR)."
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.9",
  "numpy>=1.26",
  "Pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13"]
llm = ["requests>=2.32"]
test = ["pytest>=8.0"]
all = ["pytesseract>=0.3.13", "requests>=2.32", "pytest>=8.0"]

[project.scripts]
image-to-vir = "image_to_tikz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
