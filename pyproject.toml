[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "image-to-tikz-compiler"
version = "0.3.0"
description = "Deterministic, model-free image analysis front-end that converts diagrams into an LLM-readable visual intermediate representation."
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.9",
  "numpy>=1.26",
  "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
all = ["pytest>=8.0"]

[project.scripts]
image-to-vir = "image_to_tikz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
